<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Rex's Field Manual</title>
<link rel="stylesheet" href="vendor/fonts.css">
<style>
/* Layout: operator's handbook — fixed index rail on the left, reading pane with section map on wide screens */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#141922; --muted:#586174; --line:#dce1e9;
  --accent:#2c4bd1; --accent-ink:#ffffff; --accent-soft:#e6ebfc; --code:#edf0f6; --danger:#b42318; --danger-soft:#fdecea;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117; --surface:#151a23; --ink:#e5e9f0; --muted:#97a0b2; --line:#252c39;
  --accent:#8fa3ff; --accent-ink:#0e1117; --accent-soft:#1d2540; --code:#1a1f2a; --danger:#ff8a80; --danger-soft:#3a1d1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1117; --surface:#151a23; --ink:#e5e9f0; --muted:#97a0b2; --line:#252c39;
  --accent:#8fa3ff; --accent-ink:#0e1117; --accent-soft:#1d2540; --code:#1a1f2a; --danger:#ff8a80; --danger-soft:#3a1d1d; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px}
.brand{padding-block:20px 12px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{font:700 26px/1 var(--display);letter-spacing:.01em;margin:0;text-transform:uppercase}
.brand span{font:500 11px var(--mono);color:var(--muted);letter-spacing:.06em}
.search{position:relative}
.search input{width:100%;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 11px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding-block:12px}
.chip{border:1px solid var(--line);background:transparent;border-radius:4px;padding:3px 8px;font:500 11px var(--mono);letter-spacing:.06em;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.toc{flex:1;overflow:auto;min-height:0;padding-bottom:12px;margin-inline:-6px}
.grp{margin-top:14px}
.grp h3{margin:0 6px 4px;font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase;display:flex;gap:8px}
.grp h3 b{color:var(--accent);font-weight:600}
.item{display:flex;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:6px;border-radius:5px;cursor:pointer;align-items:baseline}
.item:hover{background:var(--bg)}
.item[aria-current="true"]{background:var(--accent-soft)}
.item i{font:500 11px var(--mono);font-style:normal;color:var(--muted);min-width:20px;font-variant-numeric:tabular-nums}
.item span{font-size:14px;line-height:1.35}
.railfoot{border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.grow{flex:1}
a.btn{display:inline-block;text-decoration:none;color:inherit;white-space:nowrap}
a.btn.primary{color:var(--accent-ink)}

.main{overflow:auto;min-width:0}
.page{display:grid;grid-template-columns:minmax(0,760px) 200px;gap:48px;justify-content:center;
  padding-block:40px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page.solo{grid-template-columns:minmax(0,760px)}
article{min-width:0}
.eyebrow{font:500 12px var(--mono);letter-spacing:.08em;color:var(--accent);text-transform:uppercase;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow .tag{color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 6px;text-transform:none;letter-spacing:0}
.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-top:8px}
article h1{font:700 clamp(32px,5vw,44px)/1.02 var(--display);margin:0;text-wrap:balance;letter-spacing:.005em}
.lede{color:var(--muted);font-size:17px;margin:12px 0 0;max-width:62ch}
.meta{font:12px var(--mono);color:var(--muted);margin-top:14px;padding-bottom:20px;border-bottom:1px solid var(--line)}

.md{margin-top:8px}
.md h2{font:700 24px/1.2 var(--display);letter-spacing:.01em;margin:36px 0 10px;text-transform:uppercase;scroll-margin-top:16px}
.md h3{font-size:16px;margin:24px 0 8px}
.md p,.md li{max-width:68ch}
.md ul,.md ol{padding-left:22px}
.md li{margin:4px 0}
.md a{color:var(--accent)}
.md code{font:13px var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
.md pre{position:relative;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:14px 0}
.md pre code{background:none;padding:0;font-size:13px;line-height:1.55;white-space:pre}
.md pre .copy{position:absolute;top:6px;right:6px;font:500 11px var(--mono);border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:3px 8px;cursor:pointer;opacity:.75}
.md pre .copy:hover{opacity:1}
.tablewrap{overflow-x:auto;margin:14px 0;border:1px solid var(--line);border-radius:8px}
.md table{border-collapse:collapse;width:100%;font-size:14px}
.md th,.md td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.md th{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
.md tr:last-child td{border-bottom:0}
.md blockquote{margin:14px 0;padding:4px 16px;border-left:3px solid var(--accent);color:var(--muted)}
.md strong{font-weight:600}

.map{position:sticky;top:40px;align-self:start;font-size:13px}
.map h4{font:600 11px var(--mono);letter-spacing:.08em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
.map a{display:block;color:var(--muted);text-decoration:none;padding:4px 0 4px 10px;border-left:1px solid var(--line)}
.map a:hover{color:var(--ink);border-left-color:var(--accent)}

.empty{max-width:520px;margin:12vh auto 0;text-align:left}
.empty h2{font:700 30px/1.1 var(--display);text-transform:uppercase;margin:0 0 8px}
.empty p{color:var(--muted)}

/* editor */
.editor{display:grid;gap:14px}
.editor label{display:grid;gap:4px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.editor input,.editor select,.editor textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 11px;font:15px var(--body);color:var(--ink);text-transform:none;letter-spacing:0}
.editor textarea{font:13px/1.55 var(--mono);min-height:52vh;resize:vertical}
.row2{display:grid;grid-template-columns:160px 1fr;gap:12px}
.edbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.edbar .sp{flex:1}
.tabs{display:flex;gap:4px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.preview{border:1px solid var(--line);border-radius:8px;padding:4px 20px 20px;background:var(--surface);min-height:52vh}
.confirm{display:flex;gap:8px;align-items:center;background:var(--danger-soft);border-radius:6px;padding:8px 12px;font-size:14px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}
.err{color:var(--danger);font-size:14px}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:max(20px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.menu{display:none}
mark{background:var(--accent-soft);color:inherit;border-radius:2px}

@media (max-width:1100px){.page{grid-template-columns:minmax(0,760px)}.map{display:none}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding-right:max(16px,env(safe-area-inset-right,0px))}
  .rail .toc,.rail .chips,.rail .railfoot,.rail .search{display:none}
  .rail.open .toc,.rail.open .chips,.rail.open .search{display:block}
  .rail.open .chips{display:flex}
  .rail.open .toc{max-height:55vh}
  .brand{padding-block:12px}
  .menu{display:inline-block}
  .page{padding-block:24px 60px}
  .row2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <nav class="rail" id="rail" aria-label="Topics">
    <div class="brand">
      <h1>Field Manual</h1>
      <span id="count">—</span>
      <button class="btn menu" id="menuBtn" aria-expanded="false" aria-controls="rail">Topics</button>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Search commands, tools, steps" aria-label="Search the manual" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Filter by area"></div>
    <div class="toc" id="toc"></div>
    <div class="railfoot"><a class="btn primary grow" id="newBtn" href="https://github.com/displayrex/field-manual/new/main/content" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">New page on GitHub</a></div>
  </nav>
  <main class="main" id="main">
    <div class="page solo"><div class="empty" id="boot">
      <h2>Loading your manual</h2>
      <p>Reading manifest.json…</p>
    </div></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="app.js"></script>

</body>
</html>
